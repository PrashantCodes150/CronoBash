<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="50%" stop-color="#FF2A00"/>
      <stop offset="100%" stop-color="#9900FF"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Ambient Glow Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#bgGrad)" stroke-width="14" opacity="0.4" filter="url(#glow)" />
  
  <!-- Outer Tech Hex-Circle Frame -->
  <circle cx="256" cy="256" r="210" fill="#0A0D14" stroke="url(#ringGrad)" stroke-width="8" />

  <!-- Inner Cyber Hourglass / Crono Gem Geometry -->
  <path d="M 160 140 L 352 140 L 276 240 L 352 372 L 160 372 L 236 240 Z" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Stylized C Core Shield -->
  <path d="M 256 180 C 210 180 180 210 180 256 C 180 302 210 332 256 332 C 290 332 318 312 326 284 L 286 284 C 280 296 268 302 256 302 C 230 302 212 282 212 256 C 212 230 230 210 256 210 C 268 210 280 216 286 228 L 326 228 C 318 200 290 180 256 180 Z" fill="#FFFFFF" />

  <!-- Center Core Diamond Power Gem -->
  <polygon points="256,224 276,256 256,288 236,256" fill="#00E5FF" filter="url(#glow)" />
</svg>
